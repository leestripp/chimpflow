<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChimpFlow — Voice Service</title>
<style>
  :root { color-scheme:dark; --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#2f81f7; --ok:#3fb950; --err:#f85149; --warn:#d29922; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px;
           background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:18px; margin:0; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  header .dot.on { background:var(--ok); }
  main { max-width:860px; margin:24px auto; padding:0 16px; }
  .card { background:var(--panel); border:1px solid var(--border);
          border-radius:10px; padding:20px; margin-bottom:16px; }
  .engine { background:var(--bg); border:1px solid var(--border);
            border-radius:8px; padding:12px 14px; }
  .engine .etitle { font-weight:600; }
  .engine .erow { margin-top:4px; }
  h2 { margin:0 0 14px; font-size:15px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.05em; }
  label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
  input[type=text], input[type=password], textarea, select {
    width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border);
    background:var(--bg); color:var(--fg); font:inherit; }
  textarea { min-height:80px; resize:vertical; }
  /* dropdowns — custom arrow, themed open-list (webui-design skill) */
  select { appearance:none; -webkit-appearance:none; width:100%;
    padding:8px 32px 8px 10px; border-radius:6px; border:1px solid var(--border);
    background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b949e'/></svg>") no-repeat right 10px center;
    color:var(--fg); font:inherit; cursor:pointer; }
  select:hover { border-color:var(--dim); }
  select:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(47,129,247,.3); }
  option, optgroup { background:var(--panel); color:var(--fg); }
  input[type=checkbox], input[type=radio] { accent-color:var(--accent); }
  ::placeholder { color:var(--dim); }
  input:focus, textarea:focus, input[type=text]:focus, input[type=password]:focus
    { outline:none; border-color:var(--accent);
      box-shadow:0 0 0 2px rgba(47,129,247,.3); }
  button { padding:8px 16px; border:1px solid var(--border); border-radius:6px;
           background:#21262d; color:var(--fg); font:inherit; cursor:pointer; }
  button:hover { background:#30363d; }
  button.primary { background:var(--accent); border-color:var(--accent);
                   color:#fff; font-weight:600; }
  button.primary:hover { background:#1f6feb; }
  button:disabled:hover { background:#21262d; }
  button.danger { color:var(--err); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tabs { display:flex; gap:4px; margin-bottom:16px; }
  .tabs button { border-radius:8px 8px 0 0; border-bottom:none; }
  .tabs button.active { background:var(--panel); border-color:var(--border);
                         color:var(--fg); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--dim); font-weight:600; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px;
          background:#21262d; border:1px solid var(--border); margin:1px 2px; }
  .pill.tts { color:var(--ok); } .pill.stt { color:var(--accent); }
  .pill.admin { color:var(--warn); }
  .msg { margin-top:10px; padding:10px 12px; border-radius:6px; font-size:13px;
         display:none; white-space:pre-wrap; word-break:break-all; }
  .msg.ok { display:block; background:rgba(63,185,80,.12); color:var(--ok); }
  .msg.err { display:block; background:rgba(248,81,73,.12); color:var(--err); }
  .hidden { display:none !important; }
  .muted { color:var(--dim); font-size:12px; }
  .keycell { font-family:ui-monospace,monospace; font-size:12px; }
  #newKeyOut { font-family:ui-monospace,monospace; font-size:13px;
               background:var(--bg); border:1px solid var(--ok); border-radius:6px;
               padding:10px; margin-top:10px; word-break:break-all; display:none; }
</style>
</head>
<body>
<header>
  <span class="dot" id="statusDot"></span>
  <h1>ChimpFlow</h1>
  <span class="muted" id="statusText">voice service</span>
  <span class="muted" style="font-size:11px;border:1px solid var(--border);border-radius:8px;padding:1px 7px" title="UI build version">v0.1.2</span>
  <span style="flex:1"></span>
  <button id="logoutBtn" class="hidden">Sign out</button>
</header>
<main>

  <!-- Login -->
  <section id="loginCard" class="card">
    <h2>Sign in</h2>
    <label for="apiKeyInput">API key</label>
    <input type="password" id="apiKeyInput" placeholder="omn_sk_..." autocomplete="off">
    <div class="row" style="margin-top:12px">
      <button class="primary" id="loginBtn">Connect</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </section>

  <!-- App -->
  <div id="app" class="hidden">
    <nav class="tabs">
      <button data-tab="keys" class="active">API Keys</button>
      <button data-tab="tts">Text to Speech</button>
      <button data-tab="status">Status</button>
    </nav>

    <section id="tab-keys" class="card">
      <h2>Create key</h2>
      <div class="row">
        <input type="text" id="newKeyName" placeholder="Key name (e.g. phone-app)" style="flex:1">
        <label style="margin:0"><input type="checkbox" id="scopeTts" checked> tts</label>
        <label style="margin:0"><input type="checkbox" id="scopeStt"> stt</label>
        <label style="margin:0"><input type="checkbox" id="scopeAdmin"> admin</label>
        <button class="primary" id="createKeyBtn">Create</button>
      </div>
      <div id="newKeyOut"></div>
      <h2 style="margin-top:22px">Keys</h2>
      <table>
        <thead><tr><th>Name</th><th>ID</th><th>Scopes</th><th>Uses</th><th>Status</th><th></th></tr></thead>
        <tbody id="keysBody"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
      </table>
      <div class="msg" id="keysMsg"></div>
    </section>

    <section id="tab-tts" class="card hidden">
      <h2>Synthesize</h2>
      <label for="ttsText">Text</label>
      <textarea id="ttsText">Hello from the ChimpFlow voice service.</textarea>
      <div class="row" style="margin-top:10px">
        <select id="ttsVoice" style="flex:1">
          <option>alba</option><option>anna</option><option>azelma</option>
          <option>bill_boerst</option><option>caro_davy</option><option>charles</option>
          <option>cosette</option><option>eponine</option><option>estelle</option>
          <option>eve</option><option>fantine</option><option>george</option>
          <option>giovanni</option><option>jane</option><option>javert</option>
          <option>jean</option><option>juergen</option><option>lola</option>
          <option>marius</option><option>mary</option><option>michael</option>
          <option>paul</option><option>peter_yearsley</option><option>rafael</option>
          <option>stuart_bell</option><option>vera</option>
        </select>
        <button class="primary" id="speakBtn">Speak</button>
      </div>
      <div id="ttsResult" style="margin-top:14px"></div>
      <div class="msg" id="ttsMsg"></div>
    </section>

    <section id="tab-status" class="card hidden">
      <h2>Service</h2>
      <div id="svcStatus" class="muted">checking…</div>
      <h2 style="margin-top:20px">Engines</h2>
      <div id="ttsEngine" class="engine">checking…</div>
      <div id="sttEngine" class="engine" style="margin-top:10px">checking…</div>
    </section>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get key() { return localStorage.getItem("cf_key") || ""; },
  set key(v) { v ? localStorage.setItem("cf_key", v) : localStorage.removeItem("cf_key"); }
};

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Authorization": "Bearer " + store.key,
               "Content-Type": "application/json", ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error((await r.text()).slice(0, 300) || ("HTTP " + r.status));
  return r;
}
function showMsg(el, text, ok) {
  el.className = "msg " + (ok ? "ok" : "err");
  el.textContent = text;
}
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// ---- Tabs ----
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("active", x === b));
  ["keys", "tts", "status"].forEach(t => $("tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
  if (b.dataset.tab === "status") loadStatus();
  if (b.dataset.tab === "keys") loadKeys();
}));

// ---- Auth ----
async function tryConnect() {
  const k = $("apiKeyInput").value.trim();
  if (!k) return showMsg($("loginMsg"), "Enter your API key", false);
  store.key = k;
  try {
    await api("/admin/keys");
    enterApp();
  } catch (e) {
    store.key = "";
    showMsg($("loginMsg"), e.message, false);
  }
}
function enterApp() {
  $("loginCard").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  loadKeys(); ping();
}
$("loginBtn").addEventListener("click", tryConnect);
$("apiKeyInput").addEventListener("keydown", e => { if (e.key === "Enter") tryConnect(); });
$("logoutBtn").addEventListener("click", () => { store.key = ""; location.reload(); });

// ---- Status ----
async function ping() {
  try {
    const r = await fetch("/healthz"); const j = await r.json();
    $("statusDot").classList.add("on");
    $("statusText").textContent = j.service + " · online";
  } catch { $("statusText").textContent = "offline"; }
}
async function loadStatus() {
  ping();
  try {
    const j = await (await fetch("/healthz")).json();
    $("svcStatus").innerHTML = '<span style="color:var(--ok)">●</span> online — ' +
      esc(j.service) + ' · 127.0.0.1:8090';
  } catch (e) {
    $("svcStatus").innerHTML = '<span style="color:var(--err)">●</span> offline';
  }
  try {
    const j = await (await api("/admin/engine/models")).json();
    const all = Array.isArray(j.data) ? j.data : [];
    const tts = all.filter(m => (m.object || "model") === "model" || (m.task || "") === "tts");
    $("ttsEngine").innerHTML =
      '<div class="etitle">TTS · audio.cpp <span class="muted">127.0.0.1:8080</span></div>' +
      '<div class="erow"><span style="color:var(--ok)">●</span> reachable</div>' +
      '<div class="erow">Model: ' + (tts.length ? tts.map(m => "<b>" + esc(m.id) + "</b>").join(", ") : "none loaded") + '</div>';
  } catch (e) {
    $("ttsEngine").innerHTML =
      '<div class="etitle">TTS · audio.cpp <span class="muted">127.0.0.1:8080</span></div>' +
      '<div class="erow"><span style="color:var(--err)">●</span> unreachable — ' + esc(e.message) + '</div>';
  }
  try {
    const s = await (await api("/admin/engine/stt")).json();
    $("sttEngine").innerHTML =
      '<div class="etitle">STT · whisper.cpp <span class="muted">' + esc(s.url.replace("http://", "")) + '</span></div>' +
      (s.reachable
        ? '<div class="erow"><span style="color:var(--ok)">●</span> reachable</div>' +
          '<div class="erow">Model: <b>' + esc(s.model) + '</b></div>'
        : '<div class="erow"><span style="color:var(--err)">●</span> unreachable</div>');
  } catch (e) {
    $("sttEngine").innerHTML =
      '<div class="etitle">STT · whisper.cpp <span class="muted">127.0.0.1:8081</span></div>' +
      '<div class="erow"><span style="color:var(--err)">●</span> ' + esc(e.message) + '</div>';
  }
}

// ---- Keys ----
async function loadKeys() {
  try {
    const r = await api("/admin/keys");
    const keys = await r.json();
    $("keysBody").innerHTML = keys.map(k => {
      const status = k.revoked ? '<span style="color:var(--err)">revoked</span>'
                    : k.expired  ? '<span style="color:var(--warn)">expired</span>'
                    : '<span style="color:var(--ok)">active</span>';
      const scopes = k.scopes.map(s => `<span class="pill ${esc(s)}">${esc(s)}</span>`).join("");
      return `<tr><td>${esc(k.name)}</td><td class="keycell">${esc(k.id)}</td>` +
             `<td>${scopes}</td><td>${k.useCount ?? 0}</td><td>${status}</td>` +
             `<td>${k.revoked ? "" : `<button class="danger" data-revoke="${esc(k.id)}">Revoke</button>`}</td></tr>`;
    }).join("") || '<tr><td colspan="6" class="muted">No keys yet</td></tr>';
    document.querySelectorAll("[data-revoke]").forEach(b =>
      b.addEventListener("click", () => revokeKey(b.dataset.revoke)));
  } catch (e) { showMsg($("keysMsg"), e.message, false); }
}
$("createKeyBtn").addEventListener("click", async () => {
  const scopes = [];
  if ($("scopeTts").checked) scopes.push("tts");
  if ($("scopeStt").checked) scopes.push("stt");
  if ($("scopeAdmin").checked) scopes.push("admin");
  const name = $("newKeyName").value.trim();
  if (!name) return showMsg($("keysMsg"), "Name required", false);
  if (!scopes.length) return showMsg($("keysMsg"), "Pick at least one scope", false);
  try {
    const r = await api("/admin/keys", { method: "POST",
      body: JSON.stringify({ name, scopes }) });
    const j = await r.json();
    const out = $("newKeyOut");
    out.style.display = "block";
    out.textContent = j.rawKey;
    showMsg($("keysMsg"), "Key created — copy it now, it will not be shown again.", true);
    $("newKeyName").value = ""; loadKeys();
  } catch (e) { showMsg($("keysMsg"), e.message, false); }
});
async function revokeKey(id) {
  if (!confirm("Revoke key " + id + "?")) return;
  try {
    await api("/admin/keys/" + encodeURIComponent(id), { method: "DELETE" });
    showMsg($("keysMsg"), "Revoked " + id, true); loadKeys();
  } catch (e) { showMsg($("keysMsg"), e.message, false); }
}

// ---- TTS ----
$("speakBtn").addEventListener("click", async () => {
  const btn = $("speakBtn"); btn.disabled = true;
  showMsg($("ttsMsg"), "Synthesizing…", true);
  try {
    const r = await api("/v1/audio/speech", { method: "POST", body: JSON.stringify({
      model: "pocket-tts", input: $("ttsText").value,
      voice: $("ttsVoice").value, response_format: "wav" }) });
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    $("ttsResult").innerHTML = "";
    const audio = document.createElement("audio");
    audio.controls = true; audio.src = url; audio.style.width = "100%";
    $("ttsResult").appendChild(audio);
    audio.play().catch(() => {});
    showMsg($("ttsMsg"), "OK (" + Math.round(blob.size / 1024) + " KB)", true);
  } catch (e) { showMsg($("ttsMsg"), e.message, false); }
  btn.disabled = false;
});

// ---- Boot ----
if (store.key) { $("apiKeyInput").value = store.key; tryConnect(); } else ping();
</script>
</body>
</html>
